[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Ignore missing imports for MicroPython/M5Stack device modules
ignore = ["F401", "F403", "E402"]
extend-ignore = ["F821"]  # undefined names (M5Stack globals injected at runtime)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
